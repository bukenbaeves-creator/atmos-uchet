<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выплаты врачам — ведомость, реестр, дашборд</title>
<style>
:root{--brand:#8F0E44;--brand-l:#fdf2f6;--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--line2:#f1f3f5;
      --muted:#6b7280;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--head:#f8fafc}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#111827;font-size:14px}
header{background:var(--brand);color:#fff;padding:16px 24px}
header h1{margin:0;font-size:18px;font-weight:600}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
.tabs{display:flex;gap:2px;background:#7a0c3a;padding:0 24px}
.tabs button{background:transparent;border:none;color:#fff;opacity:.72;padding:11px 16px;font-size:13px;cursor:pointer;font-family:inherit;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-bottom-color:#fff;font-weight:600}
.wrap{max-width:1340px;margin:0 auto;padding:18px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.card h2{margin:0 0 3px;font-size:15px;font-weight:600}
.card .hint{color:var(--muted);font-size:12px;margin:0 0 14px}

/* ——— панель периода ——— */
.periodbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
           border-radius:10px;padding:12px 16px;margin-bottom:18px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:4px}
select,input[type=date],input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
select{min-width:260px}
.period-info{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.5}
.warnbar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px;width:100%}

/* ——— таблицы ——— */
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:9px;background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line2);white-space:nowrap;background:#fff}
thead th{position:sticky;background:var(--head);font-size:11px;text-transform:uppercase;letter-spacing:.03em;
         color:var(--muted);font-weight:600;z-index:3;border-bottom:1px solid var(--line)}
thead tr:first-child th{top:0;height:30px}
thead tr:nth-child(2) th{top:30px}
thead th.grp{text-align:center;border-left:1px solid var(--line);color:#374151;background:#eef1f4}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.zero{color:#cbd5e1}
td.neg{color:var(--bad)}
td.accr{background:var(--brand-l);font-weight:600}
tbody tr:hover td{background:#fafbfc}
tbody tr:hover td.accr{background:#fbe8f0}
tbody tr.alt td{background:#fcfcfd}
tbody tr.alt:hover td{background:#f7f8f9}
.sticky1{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line2)}
.sticky2{position:sticky;z-index:2;box-shadow:1px 0 0 var(--line)}
thead .sticky1,thead .sticky2{z-index:5}
tfoot td{position:sticky;bottom:0;background:#f8fafc;font-weight:700;border-top:2px solid #111827;z-index:3}
tfoot td.sticky1,tfoot td.sticky2{z-index:4;background:#f8fafc}
tr.click{cursor:pointer}
.flag{display:inline-block;width:3px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:7px}
.flag.y{background:#f59e0b}.flag.r{background:#dc2626}.flag.n{background:transparent}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:#111827}
th .arr{opacity:.45;font-size:9px}
.compact th,.compact td{padding:4px 8px;font-size:12px}

/* ——— прочее ——— */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)};select{min-width:180px}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:21px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:9px;background:#eef1f4;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.chart .stack{width:100%;display:flex;gap:3px;align-items:flex-end;height:140px}
.chart .b{flex:1;border-radius:3px 3px 0 0}
.chart .b1{background:var(--brand)}.chart .b2{background:#e3b7c8}
.chart .lab{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.sig{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.sig .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.sig .d{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag.g{background:#ecfdf5;color:var(--ok)}.tag.y{background:#fffbeb;color:var(--warn)}
.tag.r{background:#fef2f2;color:var(--bad)}.tag.n{background:#f1f5f9;color:var(--muted)}
.back{background:none;border:none;color:var(--brand);cursor:pointer;font-size:13px;padding:0;font-family:inherit;margin-bottom:10px}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:10px 12px;font-size:12px;margin-top:12px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.small{font-size:12px;color:var(--muted)}
.sum-table td{border-bottom:1px solid var(--line2);white-space:normal}
.sum-table tr.tot td{font-weight:700;border-top:2px solid #111827;background:#fafafa}
</style>
</head>

<script>

const nf = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const fmt = n => nf.format(Math.round(n));
const money = (n,cls) => n===0 ? '<td class="num zero">—</td>' : `<td class="num ${n<0?'neg':''} ${cls||''}">${fmt(n)}</td>`;
const dmy = s => { const d=new Date(s); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); };
const dm  = s => { const d=new Date(s); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); };
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN2=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const iso = d => d.toISOString().slice(0,10);

/* ---------- ПЕРИОДЫ: только завершённые, выпадающим списком ---------- */
function buildPeriods(){
  const P=[], t=new Date(TODAY);
  const dow=(t.getDay()+6)%7;                       // 0=пн
  const thisMon=new Date(t); thisMon.setDate(t.getDate()-dow);
  for(let i=1;i<=2;i++){
    const from=new Date(thisMon); from.setDate(thisMon.getDate()-7*i);
    const to=new Date(from); to.setDate(from.getDate()+6);
    P.push({id:'w'+i,kind:'weekly',closed:true,
      label:(i===1?'Прошлая неделя':'Позапрошлая неделя')+` · ${dm(from)}–${dm(to)}`,from,to});
  }
  for(let i=1;i<=2;i++){
    const from=new Date(t.getFullYear(),t.getMonth()-i,1);
    const to=new Date(t.getFullYear(),t.getMonth()-i+1,0);
    P.push({id:'m'+i,kind:'monthly',closed:true,
      label:(i===1?'Прошлый месяц':'Позапрошлый месяц')+` · ${MN2[from.getMonth()]} ${from.getFullYear()}`,from,to});
  }
  const q=Math.floor(t.getMonth()/3)-1, qy=q<0?t.getFullYear()-1:t.getFullYear(), qq=(q+4)%4;
  P.push({id:'q1',kind:'custom',closed:true,label:`Прошлый квартал · ${qq+1} кв. ${qy}`,
          from:new Date(qy,qq*3,1),to:new Date(qy,qq*3+3,0)});
  P.push({id:'cw',kind:'weekly',closed:false,label:`Текущая неделя (не закрыта) · ${dm(thisMon)}–${dm(t)}`,from:thisMon,to:t});
  P.push({id:'cm',kind:'monthly',closed:false,label:`Текущий месяц (не закрыт) · ${MN2[t.getMonth()]} ${t.getFullYear()}`,
          from:new Date(t.getFullYear(),t.getMonth(),1),to:t});
  P.push({id:'custom',kind:'custom',closed:true,label:'Произвольный период…',from:null,to:null});
  return P;
}
const PERIODS=buildPeriods();
let periodId='m1', customFrom='2026-07-01', customTo='2026-07-31';
function curPeriod(){
  const p=PERIODS.find(x=>x.id===periodId);
  if(p.id==='custom') return {...p,from:new Date(customFrom),to:new Date(customTo),label:`Произвольный период · ${dmy(customFrom)}–${dmy(customTo)}`};
  return p;
}

const COMPS=[{key:'acq',col:'Комиссия банка'},{key:'anes',col:'Наркоз/седация'},{key:'impl',col:'Импланты'},
             {key:'mat',col:'Расходники'},{key:'asst',col:'Медсестра'},{key:'tax',col:'Налог с операции'}];
const AFTER=[{key:'rent',col:'Аренда дня'},{key:'admin',col:'Бонус админа'}];

function calcOp(op){
  const doc=DOCTORS.find(d=>d.id===op.doc); if(!doc||doc.tariff) return null;
  const c=doc.cfg, paid=op.pays.reduce((s,p)=>s+p.a,0);
  const byCh=ch=>op.pays.filter(p=>p.ch===ch).reduce((s,p)=>s+p.a,0);
  const parts={};
  parts.acq = c.acq.own ? paid*c.acq.rate/100
            : byCh('kaspi')*c.acq.rate/100 + byCh('forte')*RATES.forte/100 + byCh('halyk')*RATES.halyk/100;
  parts.anes=op.anes; parts.impl=op.impl; parts.mat=op.mat; parts.asst=op.asst; parts.tax=op.sum*(c.tax||0)/100;
  const before=COMPS.reduce((s,k)=>s+(c.on[k.key]?(parts[k.key]||0):0),0);
  const share=c.shareMode==='by_source'?(op.src==='ВРАЧ'?c.doctor:c.clinic):c.share;
  const baseShare=op.sum-before, afterShare=baseShare*share/100;
  const rent=c.on.rent?(c.rent||0):0, admin=c.on.admin?(op.src==='КЛИНИКА'?5000:0):0;
  const full=afterShare-rent-admin;
  return {doc,parts,before,share,baseShare,afterShare,rent,admin,full,paidTotal:paid};
}

/* ---------- НАЧИСЛЕНИЯ-СОБЫТИЯ ---------- */
const ACCRUALS=[];
OPS.forEach(op=>{
  const r=calcOp(op); if(!r) return;
  let cum=0, prevRatio=0;
  op.pays.forEach(p=>{
    cum+=p.a;
    const ratio=Math.min(1,cum/op.sum);
    const delta=r.full*ratio - r.full*prevRatio;
    ACCRUALS.push({op,r,eventDate:p.d,payAmount:p.a,ratio,amount:delta,doc:r.doc.id,partial:ratio<1});
    prevRatio=ratio;
  });
});
// анестезиолог: одно начисление на операцию, дата события = дата полной оплаты
OPS.filter(o=>o.anesth).forEach(op=>{
  const last=op.pays[op.pays.length-1];
  ACCRUALS.push({op,r:null,eventDate:last.d,amount:LOW_TIER,doc:6,tariff:true,anesthType:'общий'});
});
const PAID_OUT={1:8000000,2:1500000,3:250000,4:900000,5:100000,6:150000};

function inPeriod(dateStr,p){ const d=new Date(dateStr); return d>=p.from && d<=p.to; }
function periodAccruals(){ const p=curPeriod(); return ACCRUALS.filter(a=>inPeriod(a.eventDate,p)); }

// фактическая ступень тарифа за календарный месяц периода
function tierCorrection(p){
  if(p.kind!=='monthly') return null;
  const cnt=OPS.filter(o=>o.anesth && new Date(o.date).getMonth()===p.from.getMonth()
                          && new Date(o.date).getFullYear()===p.from.getFullYear()).length;
  if(!cnt) return null;
  const tier=TIERS.find(t=>cnt>=t.min&&cnt<=t.max);
  return {count:cnt,tier:tier.amt,delta:(tier.amt-LOW_TIER)*cnt};
}

function docTotals(){
  const A=periodAccruals(), p=curPeriod(), corr=tierCorrection(p);
  return DOCTORS.map(d=>{
    const rows=A.filter(a=>a.doc===d.id);
    let accrued=rows.reduce((s,a)=>s+a.amount,0);
    let correction=0;
    if(d.tariff && corr && rows.length){ correction=corr.delta; accrued+=correction; }
    const ops=[...new Set(rows.map(a=>a.op.id))].length;
    const revenue=[...new Set(rows.map(a=>a.op))].reduce((s,o)=>s+o.sum,0);
    const direct=[...new Set(rows.map(a=>a.op))].reduce((s,o)=>{
      const r=calcOp(o); return s+(r?r.parts.acq:0)+o.anes+o.mat+o.impl+o.asst;},0);
    const paidOut=Math.min(PAID_OUT[d.id]||0,accrued);
    return {d,count:ops,revenue,accrued,correction,paidOut,debt:accrued-paidOut,direct,
            clinic:revenue-accrued-direct,avg:ops?accrued/ops:0,sharePct:revenue?accrued/revenue*100:0,rows};
  }).filter(t=>t.rows.length);
}

      <tbody>${[...T].sort((a,b)=>b.sharePct-a.sharePct).map((t,i)=>`<tr class="${i%2?'alt':''}">
        <td class="sticky1">${t.d.name}</td>
        <td><div class="bar"><i style="width:${(t.sharePct/maxShare*100).toFixed(0)}%"></i></div><div class="small">${t.sharePct.toFixed(1)}%</div></td>
        ${money(t.accrued)}${money(t.direct)}
        <td class="num" style="color:${t.clinic<0?'var(--bad)':'inherit'}">${fmt(t.clinic)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Динамика по месяцам, млн ₸</h2>
    <div class="chart">${trend.map(t=>`<div class="col"><div class="stack">
      <div class="b b1" style="height:${(t.a/mx*100).toFixed(0)}%" title="начислено ${t.a.toFixed(1)} млн"></div>
      <div class="b b2" style="height:${(t.p/mx*100).toFixed(0)}%" title="выплачено ${t.p.toFixed(1)} млн"></div>
    </div><div class="lab">${t.m}</div></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--brand)"></i>начислено</span><span><i style="background:#e3b7c8"></i>выплачено</span></div>
  </div>

  <div class="card">
    <h2>Сигналы и проблемы</h2>
    <p class="hint">В приложении каждый пункт кликабелен и ведёт к записи.</p>
    ${sig('r','Операция без схемы выплаты','Жанибекова Ж. · Ильин К.О. · 10.08.2026 · 900 000 ₸ — врач не заведён в справочнике получателей, начисление не создано')}
    ${sig('r','Начисление с ручной корректировкой','Данияр А. · резидент Александр · 27.07.2026 — расходники изменены вручную, проверить обоснование')}
    ${sig('y','Расчёт по нормативу вместо факта склада','Нурланова А. · Бектемиров А. · 24.07.2026 — списания не проведены, взят норматив 12 000 ₸')}
    ${sig('y','Неоплаченный остаток по операции','Ергалиева Л. · Сулейманова В.И. · оплачено 600 000 из 1 200 000, доплата 12.08 — доначисление ушло в августовскую ведомость')}
    ${sig('y','Анестезиолог: ставка предварительная','Недельные ведомости августа посчитаны по нижней ставке 35 000 ₸ — корректировка появится в месячной ведомости')}
    ${sig('n','Неподписанные АВР','2 акта за июнь — Кулесбаев А., Сагадатов Н.')}
  </div>`;
}
function sig(l,t,d){const c={r:'var(--bad)',y:'var(--warn)',n:'var(--muted)'}[l];
  return `<div class="sig"><div class="dot" style="background:${c}"></div><div><div><b>${t}</b></div><div class="d">${d}</div></div></div>`;}

function freeHTML(){
  const p=curPeriod(), A=periodAccruals();
  return `<div class="card">
    <h2>Свободные начисления</h2>
    <p class="hint">Право на выплату наступило (деньги поступили), в ведомость ещё не включены. Отсюда собирается любая ведомость.</p>
    ${A.length?`<div class="tbl-wrap ${compact?'compact':''}"><table>
      <thead><tr><th class="sticky1" style="min-width:110px">Дата события</th><th style="min-width:190px">Врач</th><th>Пациент</th>
        <th>Основание</th><th class="num">Оплата</th><th class="num">Начислено</th><th>Статус</th></tr></thead>
      <tbody>${A.slice().sort((a,b)=>a.eventDate<b.eventDate?-1:1).map((a,i)=>`<tr class="${i%2?'alt':''}">
        <td class="sticky1">${dmy(a.eventDate)}</td><td>${DOCTORS.find(d=>d.id===a.doc).name}</td><td>${a.op.patient}</td>
        <td class="small">${a.tariff?'тариф за операцию '+dmy(a.op.date):'оплата по операции '+dmy(a.op.date)+(a.partial?' (частичная)':'')}</td>
        ${money(a.payAmount||0)}${money(a.amount,'accr')}
        <td><span class="tag g">свободное</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="sticky1">Итого</td><td colspan="4">начислений: ${A.length}</td>
        ${money(A.reduce((s,a)=>s+a.amount,0),'accr')}<td></td></tr></tfoot>
    </table></div>`:`<div class="empty">За выбранный период свободных начислений нет.</div>`}
    <div class="note">Начисление уходит в ведомость только один раз: после утверждения оно получает номер ведомости и исчезает из этого списка. Это техническая гарантия того, что за одну операцию нельзя заплатить дважды.</div>
  </div>`;
}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); view=b.dataset.tab; openDoc=null; search=''; render();});
render();
</script>
</body>
</html>
